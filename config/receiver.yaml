# Receiver / antenna metadata. Becomes the RINEX header and Table T1.
# TODOs are flagged "TBD" — fill in before final paper submission.

receiver:
  manufacturer: "u-blox"
  model: "ZED-F9P-15B-00"
  type_number: "ZED-F9P-15B-00"
  firmware: "HPG L1L5 1.40"          # from datasheet; verify with MON-VER
  marker_name: "JSI1"                 # 4-char station code; TBD
  marker_number: "00JSI"              # IGS-style 5-char; TBD
  marker_type: "NON_GEODETIC"         # ship-mounted; sidecar metadata records moving status

antenna:
  manufacturer: "Tersus GNSS"
  model: "AX4E02"
  type: "AX4E02         NONE"         # 16+4 char RINEX antenna code; verify NGS ANTEX form
  serial: "TBD"
  description: "Full-Constellation Survey Antenna, NGS-calibrated, multi-band, RHCP, IP67"
  bands_tracked:
    - "GPS L1, L2, L5"
    - "GLONASS L1, L2, L3"
    - "BeiDou B1, B2, B3"
    - "Galileo E1, E5a, E5b, E6"
    - "QZSS L1, L2, L5, L6"
    - "NavIC L5"
    - "SBAS L1, L5"
    - "L-Band (correction services)"
  pco_mm: 59.14                       # phase-centre offset, datasheet V1.4
  pcv_accuracy_mm: 2.0                # phase-centre accuracy ± 2 mm
  peak_gain_dbi: 5.5
  axial_ratio_db: 3.0
  lna_gain_db: 40
  noise_figure_db: 2.0
  group_delay_ripple_ns: 5
  size_mm: "152 dia × 62.2 height"
  weight_g: 500
  connector: "TNC Female"
  ip_rating: "IP67"
  operating_temp_c: [-40, 85]
  antex_path: ""                      # NGS-calibrated; ANTEX entry should be obtained from
                                       # https://geodesy.noaa.gov/ANTCAL/ once published
  antex_source: "NGS calibration (per Tersus datasheet V1.4-20241028)"
  delta_h_m: 0.0                      # antenna-reference-point height above marker (vertical)
                                      # TBD — measure from vessel mounting plate
  delta_e_m: 0.0
  delta_n_m: 0.0

mounting:
  vessel: "R/V Laura Bassi"
  vessel_class: "PC5 Class A icebreaker"
  vessel_operator: "OGS - Istituto Nazionale di Oceanografia e di Geofisica Sperimentale"
  position: "Upper deck, ~5 m from radar radome, clear sky view"
  cable: "10 m RG223 coaxial, UV/water protection"
  housing: "Inside ship's communications cabin (above bridge), IP65 enclosure"
  reference_paper: "Bertalanič et al. 2026, Scientific Data 13:49 — Fig 2 shows the vessel and antenna position"

signals:
  # Maps gnssId -> sigId -> (RINEX obs code prefix, frequency Hz, carrier wavelength m)
  # Verified for the ZED-F9P-15B HPG L1L5 1.40 firmware on this expedition.
  GPS:
    "0": { rinex: "1C", freq_hz: 1575420000, lambda_m: 0.190293672798365 }   # L1 C/A
    "3": { rinex: "2L", freq_hz: 1227600000, lambda_m: 0.244210213424568 }   # L2 CL
    "4": { rinex: "2M", freq_hz: 1227600000, lambda_m: 0.244210213424568 }   # L2 CM
    "6": { rinex: "5I", freq_hz: 1176450000, lambda_m: 0.254828049 }         # L5 I
    "7": { rinex: "5Q", freq_hz: 1176450000, lambda_m: 0.254828049 }         # L5 Q  (tracked here)
  GAL:
    "0": { rinex: "1C", freq_hz: 1575420000, lambda_m: 0.190293672798365 }   # E1 C
    "1": { rinex: "1B", freq_hz: 1575420000, lambda_m: 0.190293672798365 }   # E1 B
    "3": { rinex: "5Q", freq_hz: 1176450000, lambda_m: 0.254828049 }         # E5a Q
    "4": { rinex: "5I", freq_hz: 1176450000, lambda_m: 0.254828049 }         # E5a I  (tracked)
    "5": { rinex: "7Q", freq_hz: 1207140000, lambda_m: 0.248349369 }         # E5b Q
    "6": { rinex: "7I", freq_hz: 1207140000, lambda_m: 0.248349369 }         # E5b I
  GLO:
    # GLONASS uses FDMA: f1 = 1602.0 + n*0.5625 MHz, f2 = 1246.0 + n*0.4375 MHz
    # freq_hz here is the centre; per-channel offsets handled in code from freqId.
    "0": { rinex: "1C", freq_hz: 1602000000, lambda_m: 0.187136107 }   # L1 OF
    "2": { rinex: "2C", freq_hz: 1246000000, lambda_m: 0.240608897 }   # L2 OF
  BDS:
    "0": { rinex: "2I", freq_hz: 1561098000, lambda_m: 0.192039486 }   # B1I (D1)
    "1": { rinex: "2I", freq_hz: 1561098000, lambda_m: 0.192039486 }   # B1I (D2)
    "2": { rinex: "7I", freq_hz: 1207140000, lambda_m: 0.248349369 }   # B2I (D1)
    "3": { rinex: "7I", freq_hz: 1207140000, lambda_m: 0.248349369 }   # B2I (D2)
    "5": { rinex: "1P", freq_hz: 1575420000, lambda_m: 0.190293672798365 }   # B1C
    "7": { rinex: "5P", freq_hz: 1176450000, lambda_m: 0.254828049 }   # B2a Q  (tracked)
  SBAS:
    "0": { rinex: "1C", freq_hz: 1575420000, lambda_m: 0.190293672798365 }
  QZSS:
    "0": { rinex: "1C", freq_hz: 1575420000, lambda_m: 0.190293672798365 }
    "1": { rinex: "1S", freq_hz: 1575420000, lambda_m: 0.190293672798365 }
    "4": { rinex: "2L", freq_hz: 1227600000, lambda_m: 0.244210213424568 }
    "5": { rinex: "2M", freq_hz: 1227600000, lambda_m: 0.244210213424568 }
    "7": { rinex: "5Q", freq_hz: 1176450000, lambda_m: 0.254828049 }
  NavIC:
    "0": { rinex: "5A", freq_hz: 1176450000, lambda_m: 0.254828049 }   # SPS L5

# GNSS id mapping (u-blox)
gnss_names:
  0: GPS
  1: SBAS
  2: GAL
  3: BDS
  4: IMES
  5: QZSS
  6: GLO
  7: NavIC

# Reference frequencies for analytic combinations
constants:
  c_m_s: 299792458.0
  R_earth_km: 6371.0
