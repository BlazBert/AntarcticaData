[project]
name = "antarctica-gnss"
version = "0.1.0"
description = "Trieste-Antarctica multi-band GNSS dataset analysis (ZED-F9P-15B, ESSD paper)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "SensorLab JSI" }]

dependencies = [
    "numpy>=1.26",
    "polars>=0.20",
    "pyarrow>=15",
    "zarr>=2.18,<3",
    "xarray>=2024.1",
    "numba>=0.59",
    "scipy>=1.11",
    "pandas>=2.1",
    "click>=8.1",
    "tqdm>=4.66",
    "pyyaml>=6.0",
    "matplotlib>=3.8",
    "cartopy>=0.22",
    "contextily>=1.4",
    "shapely>=2.0",
    "geopandas>=0.14",
    "netCDF4>=1.6",
    "h5py>=3.10",
    "snakemake>=8.0",
    "requests>=2.31",
    "joblib>=1.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "ruff>=0.3",
    "mypy>=1.8",
    "ipykernel>=6.28",
    "jupyterlab>=4.0",
]

[project.scripts]
ubx-parse = "ubx.cli:main"
ubx-pipeline = "make_all:cli"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "B", "UP", "SIM", "RUF"]
ignore = ["E501", "N803", "N806"]

[tool.mypy]
python_version = "3.11"
strict_optional = true
warn_unused_ignores = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["verify"]
addopts = "-q --strict-markers"
markers = ["big: large-data tests, gated by RUN_BIG=1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ubx", "analysis", "ppp", "rinex", "figures", "tables"]
